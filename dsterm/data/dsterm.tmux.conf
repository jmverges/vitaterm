# tmux config for the DS terminal's dedicated server (-L dsterm).
#
# Loaded with -f, so none of this touches a personal tmux server or the one the
# agent tooling uses.

# The handheld's geometry is authoritative and must never be renegotiated.
#
# This single line is why tmux is usable here at all. It was rejected as a
# multiplexer earlier because clients of different sizes negotiate, and a 42x24
# client collapses the shared window for everyone attached. With the size pinned
# there is no negotiation: a PC attaching sees a 42x24 island in a larger
# terminal rather than dragging the DS's screen around with it.
#
# Set from a hook rather than directly, because setting window-size while the
# config is being parsed -- before any session exists -- makes tmux 3.4 exit
# with "server exited unexpectedly" and no mention of the offending line. The
# child then simply never starts, which reads as a broken server rather than a
# bad config. Measured by bisecting this file a line at a time; the same option
# set against a live server is accepted.
# Per window, NOT -g. The global form makes tmux 3.4 die with "server exited
# unexpectedly" the moment a SECOND window is created -- the same crash this
# comment already describes for parse time, reached by another road. It cost
# three Claude Code sessions before anyone measured it: Ctrl-B c from the
# handheld looked like it opened a window and bounced back, when what actually
# happened was the tmux server dying and the service starting a fresh session.
#
# Measured on a scratch socket, four variants: global crashes on the second
# window, per-window does not, and per-window still holds 42x24 when a 200x50
# client attaches -- which is the entire reason the option is here at all.
set -g default-size 42x24
set-hook -g after-new-session 'setw window-size manual'
set-hook -g after-new-window 'setw window-size manual'

# Not cosmetic. The terminal is 24 rows; a status line would spend one of them
# on tmux's own chrome, and Claude Code's TUI has no rows to spare.
set -g status off

# The emulator on the server side is pyte, driven by what this reports.
set -g default-terminal "xterm-256color"

# Escape arrives as a single byte from the handheld's X button. The default
# 500ms wait to see whether it begins a sequence makes that feel broken.
set -g escape-time 0

# Enough scrollback to be useful, small enough to stay well inside the budget.
set -g history-limit 5000

# The DS has no key for the prefix, so it can only ever be driven from a PC that
# attaches. Left at the default C-b deliberately: rebinding it would surprise
# anyone attaching out of habit.
