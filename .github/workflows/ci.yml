# The gate: every push, on a fresh clone, with a real gcc and a working ASan
# (which macOS's Apple clang has neither of), at both grid sizes, plus
# the ROM in the BlocksDS container. Green here is what "done" means.
name: ci

on:
  push:
  pull_request:
  # A release runs this whole gate first and publishes only if it is green.
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: tmux (the session lives in it)
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: install
        run: python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - name: server suite
        run: .venv/bin/python -m pytest tests -q

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: install (for the C/Python cross-check)
        run: python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - name: host suite, both geometries, ASan + UBSan, then the cross-check
        run: bash dsclient/run_tests.sh

  rom:
    runs-on: ubuntu-latest
    # Pinned, tag and digest, so a release is built with the toolchain CI
    # last went green with rather than whatever `latest` became overnight.
    # 1.23.0 or later: 1.22.x cannot open the SD card from locked-SCFG
    # launchers (dsclient/Makefile). Move it on purpose, in its own commit.
    container: skylyrac/blocksds:slim-v1.24.0@sha256:779f6193d1030c62e60d1f0f39c3e32cf4045c0bd224a45c0ceadf9d9ab01a51
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: build, 64x32 first so the 42x24 boot image is the one left
        run: |
          make -C dsclient GRID_COLS=64 GRID_ROWS=32
          make -C dsclient
          ls -l dsclient/*.nds
      # What a tag will run, run on every push, so a release never finds out
      # first that the image lacks a tool.
      - name: the release zip builds
        run: |
          command -v zip >/dev/null || { apt-get update && apt-get install -y --no-install-recommends zip; }
          sh tools/release_zip.sh ci-check
          ls -l dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: rom
          path: dsclient/dsterm-*.nds
